<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ALTTP Map</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src * ws://*:*; img-src 'self' data:; style-src 'self' 'unsafe-inline';">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #000;
  font-family: Arial, sans-serif;
  color: #ccc;
  user-select: none;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* ── Topbar ── */
#topbar {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  padding: 4px 10px; background: #111; border-bottom: 1px solid #222;
  font-size: 11px;
}
.tb-label { color: #888; }
.tb-select {
  background: #1a1a1a; color: #ccc; border: 1px solid #333;
  border-radius: 3px; padding: 2px 5px; font-size: 11px; cursor: pointer;
}
.tb-sep { color: #333; margin: 0 2px; }
.zoom-btn {
  background: #1a1a1a; color: #ccc; border: 1px solid #333;
  border-radius: 3px; padding: 0 7px; font-size: 15px; line-height: 1.6;
  cursor: pointer; font-weight: bold;
}
.zoom-btn:hover { background: #333; color: #fff; }
#zoom-label { color: #fff; min-width: 40px; text-align: center; font-size: 11px; font-weight: bold; }

/* ── Scroll area ── */
#maps-outer {
  flex: 1;
  overflow-x: hidden;
  overflow-y: auto;
  background: #000;
  min-height: 0;
  padding: 8px 8px 12px 12px;
}
#maps { display: inline-flex; flex-direction: row; gap: 12px; position: relative; }
#maps.vertical { flex-direction: column; }

.map-wrap {
  position: relative;
  width: 512px; height: 512px;
  background-size: 100% 100%;
  background-repeat: no-repeat;
  flex-shrink: 0;
}
#lw { background-image: url('map/map_lw.png'); }
#dw { background-image: url('map/map_dw.png'); }

/* ── Check dots ── */
.dot {
  position: absolute;
  width: 18px; height: 18px;
  border-radius: 2px;
  transform: translate(-50%, -50%);
  cursor: pointer;
  z-index: 2;
  transition: transform 0.08s;
}
.dot:hover { transform: translate(-50%,-50%) scale(1.5); z-index: 20; }
.dot.available { background: #4dff88; border: 2px solid #000; }
.dot.possible  { background: #ffd700; border: 2px solid #000; }
.dot.visible   { background: #ff8c00; border: 2px solid #000; }
.dot.ool       { background: #9333ea; border: 2px solid #000; }
.dot.unavail   { background: #ff4444; border: 2px solid #000; }
.dot.cleared   { background: rgba(40,40,40,0.85); border: 1.5px solid #555; z-index: 0; }
.dot.hidden    { display: none; pointer-events: none; }

/* ── Entrance markers (entrance shuffle overlay) ───────────────────────── */
.ent-marker {
  position: absolute;
  width: 13px; height: 13px;
  border: 1.5px solid #000;
  transform: translate(-50%, -50%) rotate(45deg);
  cursor: pointer;
  z-index: 5;
  background: #888;
  transition: transform 0.08s;
}
.ent-marker:hover { transform: translate(-50%,-50%) rotate(45deg) scale(1.6); z-index: 21; }
.ent-marker.unconnected { background: #4dff88; }
.ent-marker.connector   { background: #ED18E2; }
.ent-marker.dungeon     { background: #c77dff; }
.ent-marker.location    { background: #ffd700; }
.ent-marker.connect-pending { box-shadow: 0 0 0 3px #fff; }
.ent-marker.cleared { background: rgba(70,70,70,0.85); border-color: #666; opacity: 0.75; z-index: 0; }
.ent-marker.ent-unavailable:not(.cleared) { background: #d32f2f !important; border-color: #7a0000; }
.ent-marker.ent-dungeon-cleared:not(.cleared) { background: rgba(70,70,70,0.85); border-color: #666; opacity: 0.75; z-index: 0; }
.ent-marker.ent-boss-cleared:not(.cleared):not(.ent-dungeon-cleared) { background: #9bd0f5; border-color: #4a90c4; opacity: 0.85; }

/* Boss status diagonal stripe overlay for dungeon-marked entrance markers
   (mirrors .dng.boss-stripe-red/yellow, rotated to match the box shape). */
.ent-marker.boss-stripe-red::after,
.ent-marker.boss-stripe-yellow::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
}
.ent-marker.boss-stripe-red::after {
  background: linear-gradient(45deg,
    transparent calc(50% - 2px),
    #e74c3c   calc(50% - 2px),
    #e74c3c   calc(50% + 2px),
    transparent calc(50% + 2px));
}
.ent-marker.boss-stripe-yellow::after {
  background: linear-gradient(45deg,
    transparent calc(50% - 2px),
    #ffd54a   calc(50% - 2px),
    #ffd54a   calc(50% + 2px),
    transparent calc(50% + 2px));
}

/* Shape overrides: diamond = unchecked/unmarked (default).
   Box = marked with a key location code. Circle = connector. */
.ent-marker.ent-marked {
  border-radius: 2px;
  transform: translate(-50%, -50%) rotate(0deg);
}
.ent-marker.ent-marked:hover { transform: translate(-50%,-50%) rotate(0deg) scale(1.6); }
.ent-marker.ent-has-prize {
  width: 20px; height: 20px;
}
.ent-marker.connector {
  border-radius: 50%;
  transform: translate(-50%, -50%) rotate(0deg);
}
.ent-marker.connector:hover { transform: translate(-50%,-50%) rotate(0deg) scale(1.6); }
.ent-marker-prize {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 16px; height: 16px;
  object-fit: contain;
  pointer-events: none;
}
#maps.entrances-hidden .ent-marker { display: none; pointer-events: none; }
#maps:not(.entrances-hidden) .dot[data-ent-hidden="1"] { display: none; pointer-events: none; }
#maps:not(.entrances-hidden) .dng[data-ent-hidden="1"] { display: none; pointer-events: none; }

.ent-line {
  position: absolute;
  height: 2px;
  background: #ED18E2;
  transform-origin: 0 0;
  z-index: 4;
  pointer-events: none;
}
/* One-way connector: arrowhead at the destination end of the line, pulled
   back slightly so it points at (rather than sits under) the marker. */
.ent-line-oneway::after {
  content: '';
  position: absolute;
  right: 10px;
  top: 50%;
  width: 0;
  height: 0;
  border-style: solid;
  border-width: 5px 0 5px 8px;
  border-color: transparent transparent transparent #ED18E2;
  transform: translateY(-50%);
}
/* One-way connector: small dot marking the source end of the line. */
.ent-line-oneway::before {
  content: '';
  position: absolute;
  left: -3px;
  top: 50%;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ED18E2;
  transform: translateY(-50%);
}
#maps.entrances-hidden .ent-line { display: none; }

/* ── Entrance label (right-click → tag with key location code) ── */
.ent-label {
  position: absolute;
  transform: translate(-50%, -50%);
  margin-top: -16px; /* sit above the diamond marker */
  background: #000;
  color: #fff;
  border: 1px solid #555;
  border-radius: 3px;
  padding: 1px 4px;
  font-size: 10px;
  font-weight: normal;
  font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  letter-spacing: 0.3px;
  white-space: nowrap;
  pointer-events: none;
  z-index: 1;
}
#maps.entrances-hidden .ent-label { display: none; }
.ent-label.ent-label-below { margin-top: 16px; /* sit below the diamond marker instead */ }
.ent-label.ent-label-emoji {
  font-size: 11px;
  padding: 1px 3px;
  line-height: 1.2;
}
.ent-label.ent-label-emoji.ent-label-fairy {
  font-size: 8px;
  padding: 0 2px;
}
.ent-label-gold { color: #ffd700; }

/* ── Entrance right-click menu ── */
#ent-popup {
  position: fixed;
  background: rgba(20, 20, 20, 0.97);
  border: 1px solid #555;
  border-radius: 6px;
  padding: 10px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
  z-index: 10001;
  display: none;
  font-size: 11px;
  width: 620px;
  max-width: calc(100vw - 16px);
  max-height: calc(100vh - 16px);
  overflow-y: auto;
}
#ent-popup.open { display: block; }
.ent-popup-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2px 6px;
  border-bottom: 1px solid #333;
  margin-bottom: 6px;
  gap: 8px;
}
.ent-popup-title { font-size: 12px; color: #fff; font-weight: bold; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ent-popup-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.ent-popup-row label { color: #aaa; }
.ent-popup-row input[type="text"] {
  flex: 1; background: #1a1a1a; color: #ccc; border: 1px solid #333;
  border-radius: 3px; padding: 2px 5px; font-size: 11px;
}
.ent-popup-btn {
  background: #1a1a1a; color: #ccc; border: 1px solid #333;
  border-radius: 3px; padding: 3px 8px; font-size: 11px; cursor: pointer;
}
.ent-popup-btn:hover { background: #333; color: #fff; }
.ent-popup-btn.active { background: #ED18E2; color: #fff; border-color: #ED18E2; }
#ent-popup-connect { background: #ED18E2; color: #fff; border-color: #ED18E2; }
#ent-popup-connect:hover { background: #ff4df3; border-color: #ff4df3; }
.ent-popup-btn.marked { color: #fff; border: 1px solid #fff; font-weight: bold; box-shadow: 0 0 4px rgba(255,255,255,0.6); }
.ent-popup-btn.danger { color: #ff8c8c; border-color: #5a2a2a; }
.ent-popup-btn.danger:hover { background: #3a1414; color: #fff; }
.ent-popup-section-label { color: #888; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; margin: 8px 0 4px; }
.ent-popup-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 4px; }
.ent-popup-grid .ent-popup-btn { padding: 5px 4px; text-align: center; font-size: 11px; white-space: nowrap; position: relative; }
.ent-popup-prize { position: absolute; bottom: 1px; right: 1px; width: 14px; height: 14px; object-fit: contain; cursor: pointer; pointer-events: auto; }
.ent-popup-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; }
.ent-popup-conn-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.ent-popup-conn-row .swatch { width: 10px; height: 10px; border: 1px solid #000; transform: rotate(45deg); flex-shrink: 0; }

/* ── Notes & Connectors summary popup ── */
#ent-info-popup {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(20, 20, 20, 0.97);
  border: 1px solid #555;
  border-radius: 6px;
  padding: 10px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
  z-index: 10001;
  display: none;
  font-size: 11px;
  width: 980px;
  max-width: calc(100vw - 16px);
  max-height: calc(100vh - 16px);
  overflow-y: auto;
}
#ent-info-popup.open { display: block; }
.ent-info-cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.ent-info-col { min-width: 0; }
.ent-info-list { color: #ccc; line-height: 1.6; }
.ent-info-list .ent-info-empty { color: #666; font-style: italic; }
.ent-info-list .ent-info-cleared { color: #777; text-decoration: line-through; }

/* ── Connector visibility toggle (independent of overlay toggle) ── */
#maps.ent-conn-hidden .ent-line { display: none; }

/* ── Check annotations (right-click → tag with item) ── */
.dot-annotation {
  position: absolute;
  top: -4px; right: -4px;
  width: 16px; height: 16px;
  pointer-events: none;
  z-index: 3;
  filter: drop-shadow(0 0 1px #000) drop-shadow(0 0 1px #000);
  image-rendering: pixelated;
}
.dot-annotation.text {
  display: flex; align-items: center; justify-content: center;
  background: #000; color: #fff;
  border-radius: 50%;
  font-size: 11px; font-weight: bold;
  font-family: Arial, sans-serif;
}

#annotation-popup {
  position: fixed;
  background: rgba(20, 20, 20, 0.97);
  border: 1px solid #555;
  border-radius: 6px;
  padding: 6px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
  z-index: 10000;
  display: none;
}
#annotation-popup.open { display: block; }
.popup-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 4px 6px;
  border-bottom: 1px solid #333;
  margin-bottom: 6px;
}
.popup-title { font-size: 11px; color: #ccc; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.popup-clear {
  font-size: 10px; color: #ff8c8c; background: transparent;
  border: 1px solid #5a2a2a; border-radius: 3px;
  padding: 1px 6px; cursor: pointer;
}
.popup-clear:hover { background: #3a1414; color: #fff; }
.popup-grid { display: grid; grid-template-columns: repeat(8, 28px); gap: 2px; }
.popup-item {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 3px; cursor: pointer;
  background: #1a1a1a; border: 1px solid transparent;
  transition: background 0.1s, border-color 0.1s;
}
.popup-item:hover { background: #2a3a4a; border-color: #5a8eff; }
.popup-item img { width: 22px; height: 22px; image-rendering: pixelated; }
.popup-item.text { font-size: 14px; font-weight: bold; color: #aaa; }

/* ── Dungeon markers ── */
.dng {
  position: absolute;
  width: 28px; height: 28px;
  border-radius: 3px;
  transform: translate(-50%, -50%);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  z-index: 5;
  border: 2px solid #000;
  background: #ff4444;
  overflow: hidden;
  transition: transform 0.08s;
}
.dng:hover { transform: translate(-50%,-50%) scale(1.2); z-index: 25; }
.dng.available   { background: #4dff88; border-color: #000; }
.dng.boss-cleared { background: #9bd0f5; border-color: #000; opacity: 0.75; } /* boss beaten, items remain */
.dng.possible  { background: #ffd700; border-color: #000; }
.dng.visible   { background: #ff8c00; border-color: #000; }
.dng.ool       { background: #9333ea; border-color: #000; }
.dng.unavail   { background: #ff4444; border-color: #000; }
.dng.cleared   { background: rgba(70,70,70,0.85); border-color: #666; opacity: 0.75; }
.dng img       { width: 22px; height: 22px; object-fit: contain; image-rendering: pixelated; position: relative; z-index: 4; }
.dng.no-prize  { font-size: 8px; font-weight: bold; color: #fff; }

/* ── Boss status diagonal stripe overlay ──
   Painted via ::after as a thin diagonal band across the dungeon marker.
   Red  = boss selected but item requirement not yet met, or boss unknown
          and the dungeon isn't currently reachable.
   Yellow = boss unknown and the dungeon is available/possible. */
.dng.boss-stripe-red::after,
.dng.boss-stripe-yellow::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
}
.dng.boss-stripe-red::after {
  background: linear-gradient(45deg,
    transparent calc(50% - 2.5px),
    #e74c3c   calc(50% - 2.5px),
    #e74c3c   calc(50% + 2.5px),
    transparent calc(50% + 2.5px));
}
.dng.boss-stripe-yellow::after {
  background: linear-gradient(45deg,
    transparent calc(50% - 2.5px),
    #ffd54a   calc(50% - 2.5px),
    #ffd54a   calc(50% + 2.5px),
    transparent calc(50% + 2.5px));
}

/* ── Bottom bar ── */
#bottombar {
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  padding: 3px 10px; background: #0a0a0a; border-top: 1px solid #1a1a1a;
  font-size: 10px;
}
#legend { display: flex; align-items: center; gap: 10px; }
.leg    { display: flex; align-items: center; gap: 3px; }
.lb     { width: 10px; height: 10px; border-radius: 2px; }
.lb.available { background: #4dff88; border: 1.5px solid #000; }
.lb.possible  { background: #ffd700; border: 1.5px solid #000; }
.lb.visible   { background: #ff8c00; border: 1.5px solid #000; }
.lb.ool       { background: #9333ea; border: 1.5px solid #000; }
.lb.unavail   { background: #ff4444; border: 1.5px solid #000; }
.lb.cleared   { background: rgba(40,40,40,0.85); border: 1px solid #555; }
#conn-status  { color: #555; font-weight: bold; letter-spacing: 0.3px; }
#conn-status.connected    { color: #4dff88; }
#conn-status.connecting   { color: #ffd700; }
#conn-status.disconnected { color: #555; }
#conn-status.error        { color: #ff4444; }

#reconnect-btn {
  width: 20px; height: 20px;
  font-size: 14px; line-height: 20px; text-align: center; padding: 0;
  background: rgba(0,0,0,0.7); color: #7ab8f5;
  border: 1px solid #3a6ea8; border-radius: 4px;
  cursor: pointer; transition: color 0.2s, background 0.2s;
}
#reconnect-btn:hover { background: #2a5a9c; color: #fff; }
#reconnect-btn:active { transform: scale(0.9); }
#reconnect-btn.spinning {
  color: #ffd700; border-color: #ffd700; cursor: default;
  animation: spin 1s linear infinite;
}
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* ── Tooltip ── */
#tip {
  position: fixed; pointer-events: none; z-index: 9999;
  background: rgba(0,0,0,0.92); color: #eee;
  font-size: 11px; padding: 4px 9px;
  border-radius: 3px; border: 1px solid #333;
  white-space: nowrap; display: none;
}
</style>
</head>
<body>

<div id="topbar">
  <span class="tb-label">Layout:</span>
  <select id="layout-sel" class="tb-select" onchange="setLayout(this.value)">
    <option value="horizontal">Horizontal</option>
    <option value="vertical">Vertical</option>
  </select>
  <span class="tb-sep">|</span>
  <button class="zoom-btn" onclick="changeZoom(-1)">&#8722;</button>
  <span id="zoom-label">100%</span>
  <button class="zoom-btn" onclick="changeZoom(+1)">+</button>
  <span class="tb-sep" id="ent-sep-1">|</span>
  <label class="tb-label" id="ent-conn-toggle-wrap" style="cursor:pointer;">
    <input type="checkbox" id="ent-conn-toggle"> Connectors
  </label>
  <span class="tb-sep" id="ent-sep-2">|</span>
  <button class="zoom-btn" id="ent-info-btn" style="font-size:11px;padding:0 8px;">Notes &amp; Connectors</button>
  <span class="tb-sep">|</span>
  <button class="zoom-btn" id="checklist-btn" style="font-size:11px;padding:0 8px;" onclick="openCheckList()">☑ Checks</button>
</div>

<div id="maps-outer">
  <div id="maps">
    <div class="map-wrap" id="lw"></div>
    <div class="map-wrap" id="dw"></div>
  </div>
</div>

<div id="bottombar">
  <div id="legend">
    <div class="leg"><div class="lb available"></div><span>Available</span></div>
    <div class="leg"><div class="lb possible"></div><span>Possible</span></div>
    <div class="leg"><div class="lb visible"></div><span>Visible</span></div>
    <div class="leg"><div class="lb ool"></div><span>OutLogic</span></div>
    <div class="leg"><div class="lb unavail"></div><span>Unavail</span></div>
    <div class="leg"><div class="lb cleared"></div><span>Cleared</span></div>
  </div>
  <div style="display:flex;align-items:center;gap:6px;">
    <span id="conn-status" class="disconnected">● No device</span>
    <button id="reconnect-btn" title="Reconnect to QUsb2Snes" onclick="mapReconnect()">↻</button>
    <button id="reset-btn" title="Reset all checks (new game)" onclick="resetChecks()" style="background:#1a0808;color:#ff6666;border:1px solid #5a2020;border-radius:3px;padding:0 7px;font-size:11px;line-height:1.7;cursor:pointer;" onmouseover="this.style.background='#2a1010'" onmouseout="this.style.background='#1a0808'">⟳ New Game</button>
    <button class="zoom-btn" id="ent-save-btn" style="font-size:11px;padding:0 8px;display:none;" onclick="saveEntState()">💾 Save</button>
    <button class="zoom-btn" id="ent-load-btn" style="font-size:11px;padding:0 8px;display:none;" onclick="loadEntState()">📂 Load</button>
  </div>
</div>

<div id="tip"></div>

<!-- Right-click → tag check with an item -->
<div id="annotation-popup">
  <div class="popup-header">
    <span class="popup-title" id="annotation-title">Tag check</span>
    <button class="popup-clear" id="annotation-clear" type="button">Clear</button>
  </div>
  <div class="popup-grid" id="annotation-grid"></div>
</div>

<!-- Right-click on entrance marker → add connector / tag key location -->
<div id="ent-popup">
  <div class="ent-popup-header">
    <span class="ent-popup-title" id="ent-popup-title">Entrance</span>
    <button class="ent-popup-btn danger" id="ent-popup-clear" type="button">Clear Label</button>
  </div>
  <div class="ent-popup-row">
    <button class="ent-popup-btn" id="ent-popup-connect" type="button">Add Connector</button>
    <label style="display:flex;align-items:center;gap:4px;">Note: <input type="text" id="ent-popup-note" placeholder=""></label>
    <button class="ent-popup-btn danger" id="ent-popup-note-clear" type="button">Clear Note</button>
  </div>
  <div id="ent-popup-connections"></div>
  <div class="ent-popup-cols" id="ent-popup-cols"></div>
</div>

<!-- "Notes & Connectors" button → summary popup -->
<div id="ent-info-popup">
  <div class="ent-popup-header">
    <span class="ent-popup-title">Notes &amp; Connectors</span>
    <label style="display:flex;align-items:center;gap:4px;color:#aaa;margin-left:auto;font-size:11px;">
      <input type="checkbox" id="ent-info-show-labels" checked> Show labels
    </label>
    <button class="ent-popup-btn" id="ent-info-close" type="button">Close</button>
  </div>
  <div class="ent-info-cols">
    <div class="ent-info-col">
      <div class="ent-popup-row">

function sramCleared(data, flag) {
  if (!data || !data.length) return false;
  if (Array.isArray(flag[0])) {
    // Group flag: ALL sub-flags must be set
    for (var i = 0; i < flag.length; i++) {
      var off = flag[i][0], mask = flag[i][1];
      if (off >= data.length) return false;
      if ((data[off] & mask) === 0) return false;
    }
    return true;
  }
  // Single flag
  var off = flag[0], mask = flag[1];
  if (off >= data.length) return false;
  return (data[off] & mask) !== 0;
}

function dungeonColor(key) {
  var it = window.trackerItems;
  var hasMedallion = function(dungeonKey) {
    if (it.mmMedallion > 0 && dungeonKey === 'mm') {
      var med = it.mmMedallion; // 1=bombos,2=ether,3=quake
      return (med === 1 && it.bombos) || (med === 2 && it.ether) || (med === 3 && it.quake);
    }
    if (it.trMedallion > 0 && dungeonKey === 'tr') {
      var med = it.trMedallion;
      return (med === 1 && it.bombos) || (med === 2 && it.ether) || (med === 3 && it.quake);
    }
    // If unset, any medallion works as possibility
    return it.bombos || it.ether || it.quake;
  };

  var settings  = window.trackerSettings;
  var swordless = settings.swordless === 'yes';
  var inverted  = settings.inverted;
  // LW access in inverted: pearl + portal route
  // LW access in inverted — two tiers:
  // lwDM: Death Mountain portal (glove/flute + pearl)
  // lwVillage: Village portal (hammer+glove, titans mitt, or aga+hookshot route) — general LW access
  var lwDM      = !inverted || (it.moonpearl && it.hammer && ((it.gloves >= 1 && it.hookshot) || (it.gloves >= 2 && it.hammer)) && (it.lamp || it.flute >= 1));
  var lwVillage = !inverted || (
    it.moonpearl &&
    (it.agahnim || it.gloves >= 2 || (it.gloves >= 1 && it.hammer))
  );
  var lwAccess = lwVillage; // default general LW access

  switch (key) {
    case 'ep': {
      // Inverted: EP is in LW — requires moon pearl to access
      if (!lwAccess) return 'red';
      // Non-enemizer: bow required to beat Armos Knights
      if (settings.enemizer === 'no' && !it.bow) return 'yellow';
      if (settings.dungeonItems === 'keysanity') {
        if (!it.epBigKey) return 'yellow';
      }
      return it.lamp ? 'green' : 'yellow';
    }

    case 'dp':
      // Entrance shuffle: the DP N (or W/M/E) label can be placed on any
      // real entrance marker, anywhere on the map — no book/mirror/connector
      // access check applies at all. Reaching the boss only requires the DP
      // big key and a light source (lamp or firerod).
      if (settings.entranceShuffle) {
        if (!it.dpBigKey || (!it.lamp && !it.firerod)) return 'yellow';
        return 'green';
      }
      // Inverted: DP is in LW — requires LW access + book only (mirror route not available in inverted)
      if (!lwAccess) return 'red';
      var hasAccess = inverted ? it.book : (it.book || (it.mirror && it.flute && it.gloves >= 2));
      if (!hasAccess) return 'red';
      if (!it.boots || !it.gloves || (!it.lamp && !it.firerod)) return 'yellow';
      if (['keysanity','mapcompasskeys'].includes(settings.dungeonItems)) {
        var dpKeys = (it.dpSmallKeys) || 0;
        if (dpKeys < 1) return 'yellow';
      }
      if (settings.dungeonItems === 'keysanity') {
        if (!it.dpBigKey) return 'yellow';
      }
      return 'green';

    case 'toh': {
      // Entrance shuffle: the overworld access route to this entrance is
      // governed by EntLogic/region reachability (and the synthetic
      // "found" region grants), not by the normal vanilla item routes
      // checked below — so skip the outdoor-access check entirely.
      var isEntShuffle = !!(window.trackerSettings && window.trackerSettings.entranceShuffle);
      if (!isEntShuffle) {
        // Inverted: TOH is on DM — accessible via DM portal (glove+pearl)
        if (!lwDM) return 'red';
        // Inverted: TOH requires hammer to enter
        if (inverted && !it.hammer) return 'red';
        // Access routes (standard/open):
        // flute + mirror
        // flute + hookshot + hammer
        // mirror + gloves                (out of logic without lamp/flute)
        // gloves + hookshot + hammer     (out of logic without lamp/flute)
        var flute   = it.flute >= 1;
        var gloves  = it.gloves >= 1;
        var mirror  = it.mirror >= 1;
        var hookham = it.hookshot && it.hammer;
        var canAccess = inverted
          ? (it.hammer)  // inverted: hammer is the requirement; DM portal already checked via lwDM
          : ((flute && mirror) ||
             (flute && hookham) ||
             (mirror && gloves) ||
             (gloves && hookham));
        if (!canAccess) return 'red';
        // Gloves dark-cave ascent (mirror or hookshot+hammer) without lamp or
        // flute = out of logic (purple). Flute or lamp keeps it in logic.
        if (!inverted && !flute && !it.lamp && gloves && (mirror || hookham)) return 'purple';
      }
      if (['keysanity','mapcompasskeys'].includes(settings.dungeonItems)) {
        var tohKeys = (it.tohSmallKeys) || 0;
        if (tohKeys < 1) return 'yellow';
      }
      if (settings.dungeonItems === 'keysanity') {
        if (!it.tohBigKey) return 'yellow';
      }
      // Yellow if using flute route without lamp/firerod
      return (it.lamp || it.firerod) ? 'green' : 'yellow';
    }

    case 'hc':
      // Inverted: HC is in LW — requires LW access
      if (!lwAccess) return 'red';
      return it.lamp ? 'green' : 'yellow';

    case 'ct': {
      if (inverted) {
        var _ctEntShuffle = !!(settings.entranceShuffle);
        if (_ctEntShuffle) {
          // Entrance shuffle inverted: dungeon found via connector — access proven.
          // Same as non-inverted entrance shuffle: sword1 + lamp to clear.
          if (!(it.sword >= 1 || (swordless && it.hammer))) return 'red';
          if (!it.lamp) return 'yellow';
          if (['keysanity','mapcompasskeys'].includes(settings.dungeonItems)) {
            var ctKeysInv = (it.ctSmallKeys) || 0;
            return ctKeysInv >= 2 ? 'green' : 'red';
          }
          return 'green';
        }
        // Vanilla inverted: Aga1 is on DW DM — needs glove or flute+lwVillage to climb
        var dwDMAccess = it.gloves >= 1 || (it.flute >= 1 && lwVillage);
        if (!dwDMAccess) return 'red';
        if (!it.lamp) return 'red';
        if (!(it.sword >= 1 || it.hammer || it.cape)) return 'red';
        if (['keysanity','mapcompasskeys'].includes(settings.dungeonItems)) {
          var ctKeys = (it.ctSmallKeys) || 0;
          return ctKeys >= 2 ? 'green' : 'red';
        }
        return 'green';
      }
      // Standard/open: CT is in LW — requires LW access
      if (!lwAccess) return 'red';
      // Entrance shuffle: only a sword (or hammer if swordless) and lamp are
      // required — the master-sword/cape requirement below is for the
      // normal (non-shuffle) route.
      if (settings.entranceShuffle) {
        // Keysanity/MCK: having both CT small keys already means the player
        // has been all the way through the dungeon to get them, so the
        // marker can go green on keys alone, regardless of lamp/sword.
        if (['keysanity','mapcompasskeys'].includes(settings.dungeonItems)) {
          var ctKeysEs = (it.ctSmallKeys) || 0;
          if (ctKeysEs >= 2) return 'green';
          if (ctKeysEs >= 1) return 'yellow';
        }
        if (!(it.sword >= 1 || (swordless && it.hammer))) return 'red';
        if (!it.lamp) return 'yellow';
        if (['keysanity','mapcompasskeys'].includes(settings.dungeonItems)) {
          var ctKeysEs2 = (it.ctSmallKeys) || 0;
          return ctKeysEs2 >= 2 ? 'green' : 'red';
        }
        return 'green';
      }
      // Red until lamp AND (master sword OR cape OR [swordless] hammer)
      if (!it.lamp) return 'red';
      if (!(it.sword >= 2 || it.cape || (swordless && it.hammer))) return 'red';

      if (['keysanity','mapcompasskeys'].includes(settings.dungeonItems)) {
        var ctKeys = (it.ctSmallKeys) || 0;
        return ctKeys >= 2 ? 'green' : 'red';
      }
      return 'green';
    }

    case 'pod': {
      // Entrance shuffle: marking the entrance means it's been found via a
      // connector — the vanilla moonpearl/Dark World East overworld route
      // below doesn't apply. Color depends purely on hammer + bow + lamp.
      var isEntShufflePoD = !!(window.trackerSettings && window.trackerSettings.entranceShuffle);
      if (isEntShufflePoD) {
        if (['keysanity','mapcompasskeys'].includes(settings.dungeonItems)) {
          var podKeysEs = (it.podSmallKeys) || 0;
          if (podKeysEs < 6) return 'yellow';
        }
        if (settings.dungeonItems === 'keysanity') {
          if (!it.podBigKey) return 'yellow';
        }
        return (it.hammer && it.bow && it.lamp) ? 'green' : 'yellow';
      }
      // Inverted: DW is home world — no moonpearl needed for DW access
      // But still need DW east access route
      if (!inverted && !it.moonpearl) return 'red';
      var dwEastPOD = inverted
        ? (it.hammer || (it.flute >= 1 && lwVillage) || it.flippers || (it.mirror && lwVillage) || (it.agahnim && !it.moonpearl && it.mirror))
        : (it.moonpearl && (it.agahnim || (it.gloves >= 2 && it.flippers) || (it.hammer && it.gloves >= 1)));
      if (!dwEastPOD) {
        if (inverted && it.bomb) return 'purple'; // inverted: bomb-jump to East DW = out of logic
        return 'red';
      }
      if (!it.hammer || !it.lamp || !it.bow) return 'yellow';
      if (['keysanity','mapcompasskeys'].includes(settings.dungeonItems)) {
        var podKeys = (it.podSmallKeys) || 0;
        if (podKeys < 6) return 'yellow';
      }
      if (settings.dungeonItems === 'keysanity') {
        if (!it.podBigKey) return 'yellow';
      }
      return 'green';
    }

    case 'sp':
      // Entrance shuffle: mirror isn't required to reach SP, but the "Dam"
      // location must be labeled/connected somewhere on the map (same
      // requirement as Sunken Treasure, check #111).
      if (settings.entranceShuffle) {
        // Entrance shuffle: moonpearl and the vanilla DW South access
        // formula (titan's mitt / hammer+glove / agahnim+hammer) don't
        // apply — only flippers and the "Dam" connector/label are required.
        if (!it.flippers) return 'red';
        // Only the "Dam" LABEL (placed on any real entrance marker) counts —
        // a bare connector touching the vanilla "Dam" pin's name does NOT,
        // since in entrance shuffle that pin is just one of many possible
        // physical locations and isn't inherently special.
        var spDamFound = false;
        var spLabels = window._entLabels;
        if (spLabels) {
          for (var spName in spLabels) {
            if (spLabels[spName] === 'Dam') { spDamFound = true; break; }
          }
        }
        if (!spDamFound) return 'red';
        if (['keysanity','mapcompasskeys'].includes(settings.dungeonItems)) {
          if (!it.spSmallKeys) return 'yellow';
        }
        if (settings.dungeonItems === 'keysanity') {
          if (!it.spBigKey) return 'yellow';
        }
        return (it.hookshot && it.hammer) ? 'green' : 'yellow';
      }
      // Inverted: DW is home world — no moonpearl needed
      // Still needs mirror + flippers + DW south access
      if (!inverted && (!it.moonpearl || !it.mirror || !it.flippers)) return 'red';
      if (inverted && (!it.mirror || !it.flippers)) return 'red';
      var dwSouthSP = (it.agahnim && it.hammer) || (it.hammer && it.gloves >= 1) || (it.gloves >= 2);
      if (!dwSouthSP) return 'red';
      if (it.gloves >= 2 && !it.hammer) return 'yellow';
      if (['keysanity','mapcompasskeys'].includes(settings.dungeonItems)) {
        if (!it.spSmallKeys) return 'yellow';
      }
      if (settings.dungeonItems === 'keysanity') {
        if (!it.spBigKey) return 'yellow';
      }
      return it.hookshot ? 'green' : 'yellow';

    case 'sw': {
      // Entrance shuffle: marking the entrance means it's been found via a
      // connector — the vanilla moonpearl/Dark World NW overworld route
      // below doesn't apply. Yellow needs sword (hammer if swordless);
      // green additionally needs firerod.
      var isEntShuffleSW = !!(window.trackerSettings && window.trackerSettings.entranceShuffle);
      if (isEntShuffleSW) {
        var swSwordOk = swordless ? !!it.hammer : !!it.sword;
        if (!swSwordOk) return 'yellow';
        if ((it.swSmallKeys || 0) < 1) return 'yellow';
        if (settings.dungeonItems === 'keysanity') {
          if (!it.swBigKey) return 'yellow';
        }
        return it.firerod ? 'green' : 'yellow';
      }
      // Inverted: DW is home world — SW accessible from start
      if (!inverted) {
        if (!it.moonpearl) return 'red';
        var dwNWSW = it.gloves >= 2 ||
                     (it.hammer && it.gloves >= 1) ||
                     (it.agahnim && it.hookshot && (it.hammer || it.gloves >= 1 || it.flippers));
        if (!dwNWSW) return 'red';
      }
      // Non-swordless: sword required — yellow if accessible but no sword
      if (!swordless && !it.sword) return 'yellow';
      if (settings.dungeonItems === 'keysanity') {
        if (!it.swBigKey) return 'yellow';
      }
      return it.firerod ? 'green' : 'yellow';
    }

    case 'tt': {
      // Entrance shuffle: marking the entrance means it's been found via a
      // connector — the vanilla moonpearl/Dark World NW overworld route
      // below doesn't apply. Color depends purely on hammer.
      var isEntShuffleTT = !!(window.trackerSettings && window.trackerSettings.entranceShuffle);
      if (isEntShuffleTT) {
        if (['keysanity','mapcompasskeys'].includes(settings.dungeonItems)) {
          var ttKeysEs = (it.ttSmallKeys) || 0;
          if (ttKeysEs < 1) return 'yellow';
        }
        if (settings.dungeonItems === 'keysanity') {
          if (!it.ttBigKey) return 'yellow';
        }
        return it.hammer ? 'green' : 'yellow';
      }
      // Inverted: DW is home world — TT accessible from start, just needs hammer
      if (!inverted) {
        if (!it.moonpearl) return 'red';

          p.length = 2; // currently one-way from this entrance -> make two-way
        } else {
          p[2] = fromName; // make one-way, pointing from this entrance
        }
        break;
      }
    }
    window._entConnections = entConnections;
    saveConnections();
    redrawAllConnections();
    refreshConnectionDependentDots();
    refreshSyntheticConnections();
    Object.keys(entMarkers).forEach(applyMarkerColor);
  }

  function removeConnection(nameA, nameB) {
    entConnections = entConnections.filter(function(p) {
      return !((p[0] === nameA && p[1] === nameB) || (p[0] === nameB && p[1] === nameA));
    });
    window._entConnections = entConnections;
    saveConnections();
    redrawAllConnections();
    refreshConnectionDependentDots();
    refreshSyntheticConnections();
    Object.keys(entMarkers).forEach(applyMarkerColor);
  }

  function connectionsFor(name) {
    return entConnections.filter(function(p) { return p[0] === name || p[1] === name; })
      .map(function(p) { return p[0] === name ? p[1] : p[0]; });
  }

  // ── Connector "pending" mode ──
  window._entConnectPending = null; // name of first-selected entrance, or null
  window._entConnectFinish = function(name, markerEl) {
    var pendingName = window._entConnectPending;
    var pendingMarker = entMarkers[pendingName];
    if (pendingMarker) pendingMarker.classList.remove('connect-pending');
    window._entConnectPending = null;
    if (name !== pendingName) {
      addConnection(pendingName, name);
    }
  };

  function startConnect(name) {
    // Cancel any existing pending state
    if (window._entConnectPending) {
      var prevMarker = entMarkers[window._entConnectPending];
      if (prevMarker) prevMarker.classList.remove('connect-pending');
    }
    window._entConnectPending = name;
    var marker = entMarkers[name];
    if (marker) marker.classList.add('connect-pending');
  }

  // ── Right-click popup ──
  var popup       = document.getElementById('ent-popup');
  var popupTitle  = document.getElementById('ent-popup-title');
  var popupClear  = document.getElementById('ent-popup-clear');
  var popupConnect = document.getElementById('ent-popup-connect');
  var popupNote   = document.getElementById('ent-popup-note');
  var popupConns  = document.getElementById('ent-popup-connections');
  var popupCols   = document.getElementById('ent-popup-cols');
  var activeName  = null;


  // Build the key-location code grid once.
  KEY_LOCATION_GROUPS.forEach(function(group) {
    var col = document.createElement('div');
    var label = document.createElement('div');
    label.className = 'ent-popup-section-label';
    label.textContent = group.title;
    col.appendChild(label);
    var grid = document.createElement('div');
    grid.className = 'ent-popup-grid';
    group.codes.forEach(function(pair) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ent-popup-btn';
      btn.textContent = pair[1];
      btn.dataset.code = pair[0];
      btn.dataset.markColor = pair[2] || group.color;
      btn.style.background = btn.dataset.markColor;
      btn.style.color = (pair[1] === 'Dark') ? '#fff' : '#111';
      btn.addEventListener('click', function() {
        if (!activeName) return;
        entLabels[activeName] = pair[1];
        saveLabels();
        renderLabel(activeName);
        refreshSyntheticConnections();
        refreshConnectionDependentDots();
        Object.keys(entMarkers).forEach(applyMarkerColor);
        closePopup();
      });
      // Add prize icon for dungeon labels that have a cycled prize (read-only; synced from item tracker)
      var dKeyForBtn = ENT_LABEL_TO_DUNGEON[pair[1]];
      if (dKeyForBtn && DUNGEONS[dKeyForBtn] && DUNGEONS[dKeyForBtn].prize >= 0) {
        (function(dk) {
          var prizeImg = document.createElement('img');
          prizeImg.className = 'ent-popup-prize';
          prizeImg.dataset.dkey = dk;
          prizeImg.src = PRIZE_CYCLE[DUNGEONS[dk].prize].img;
          btn.appendChild(prizeImg);
        })(dKeyForBtn);
      }
      grid.appendChild(btn);
    });
    col.appendChild(grid);
    popupCols.appendChild(col);
  });

  // Highlight grid buttons whose code is currently assigned to any entrance.
  function refreshKeyLocationMarks() {
    var usedCodes = {};
    Object.keys(entLabels).forEach(function(name) {
      usedCodes[entLabels[name]] = true;
    });
    popupCols.querySelectorAll('.ent-popup-btn').forEach(function(btn) {
      btn.classList.toggle('marked', !!usedCodes[btn.textContent]);
    });
  }
  refreshKeyLocationMarks();

  function openPopup(name, markerEl, x, y) {
    activeName = name;
    popupTitle.textContent = name;
    popupNote.value = entNotes[name] || '';
    refreshKeyLocationMarks();
    if (window.refreshPopupPrizeIcons) window.refreshPopupPrizeIcons();
    popupConnect.classList.toggle('active', window._entConnectPending === name);
    popupConnect.textContent = (window._entConnectPending === name) ? 'Cancel Connector' : 'Add Connector';

    popupConns.innerHTML = '';
    var conns = connectionsFor(name);
    if (conns.length) {
      var label = document.createElement('div');
      label.className = 'ent-popup-section-label';
      label.textContent = 'Connected To';
      popupConns.appendChild(label);
      conns.forEach(function(otherName) {
        var pair = entConnections.filter(function(p) {
          return (p[0] === name && p[1] === otherName) || (p[0] === otherName && p[1] === name);
        })[0];
        var oneWayFrom = pair && pair[2];

        var row = document.createElement('div');
        row.className = 'ent-popup-conn-row';
        var swatch = document.createElement('span');
        swatch.className = 'swatch';
        swatch.style.background = '#ED18E2';
        var span = document.createElement('span');
        span.style.flex = '1';
        span.style.color = '#ccc';
        span.textContent = oneWayFrom
          ? (oneWayFrom === name ? otherName + ' ← (one-way from here)' : otherName + ' → (one-way into here)')
          : otherName;

        var dirBtn = document.createElement('button');
        dirBtn.type = 'button';
        dirBtn.className = 'ent-popup-btn';
        dirBtn.textContent = oneWayFrom ? 'Make Two-Way' : 'One Way →';
        dirBtn.title = oneWayFrom ? 'Restore as a two-way connector' : 'Mark this connector as one-way, leading from ' + name;
        dirBtn.addEventListener('click', function() {
          toggleConnectionDirection(name, otherName);

        });

        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'ent-popup-btn danger';
        btn.textContent = 'Remove Connector';
        btn.addEventListener('click', function() {

        row.appendChild(swatch);
        row.appendChild(span);
        row.appendChild(dirBtn);
        row.appendChild(btn);
        popupConns.appendChild(row);
      });

    popup.classList.add('open');
    var pw = popup.offsetWidth, ph = popup.offsetHeight;
    var px = Math.min(x, window.innerWidth  - pw - 8);
    var py = Math.min(y, window.innerHeight - ph - 8);
    popup.style.left = Math.max(8, px) + 'px';
    popup.style.top  = Math.max(8, py) + 'px';

  function closePopup() {
    popup.classList.remove('open');

  popupClear.addEventListener('click', function() {

    refreshConnectionDependentDots();
    Object.keys(entMarkers).forEach(applyMarkerColor);
    closePopup();
  });

  popupConnect.addEventListener('click', function() {
    if (!activeName) return;

      window._entConnectPending = null;

  popupNote.addEventListener('change', function() {
    if (!activeName) return;

    else delete entNotes[activeName];
    saveNotes();
    applyMarkerColor(activeName);
  });

  popupNote.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (!activeName) return;
    var val = popupNote.value.trim();
    if (val) entNotes[activeName] = val;
    else delete entNotes[activeName];
    saveNotes();
    applyMarkerColor(activeName);
    closePopup();
  });

  var popupNoteClear = document.getElementById('ent-popup-note-clear');
  popupNoteClear.addEventListener('click', function() {
    if (!activeName) return;
    popupNote.value = '';
    delete entNotes[activeName];
    saveNotes();
    applyMarkerColor(activeName);
  });

  document.addEventListener('mousedown', function(e) {
    if (!popup.classList.contains('open')) return;
    if (popup.contains(e.target)) return;
    closePopup();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      closePopup();
      if (window._entConnectPending) {
        var marker = entMarkers[window._entConnectPending];
        if (marker) marker.classList.remove('connect-pending');
        window._entConnectPending = null;
      }
    }
  });

  window._entOpenPopup = openPopup;

  // ── Connector visibility toggle (independent of overlay show/hide) ──
  var connToggle = document.getElementById('ent-conn-toggle');
  if (connToggle) {
    var connHidden = (localStorage.getItem('ent-conn-visible') === '0');
    document.getElementById('maps').classList.toggle('ent-conn-hidden', connHidden);
    connToggle.checked = !connHidden;
    connToggle.addEventListener('change', function() {
      document.getElementById('maps').classList.toggle('ent-conn-hidden', !connToggle.checked);
      localStorage.setItem('ent-conn-visible', connToggle.checked ? '1' : '0');
    });
  }

  // ── Visibility of connector/notes controls ──
  // Only relevant for entrance-shuffle games.
  var entConnWrap     = document.getElementById('ent-conn-toggle-wrap');
  var entInfoBtn      = document.getElementById('ent-info-btn');
  var entSep1         = document.getElementById('ent-sep-1');
  var entSep2         = document.getElementById('ent-sep-2');
  var checklistBtn    = document.getElementById('checklist-btn');
  var isEntranceShuffle = !!(window.trackerSettings && window.trackerSettings.entranceShuffle);

  function updateEntControlsVisibility() {
    var show = isEntranceShuffle;
    var entSaveBtn = document.getElementById('ent-save-btn');
    var entLoadBtn = document.getElementById('ent-load-btn');
    [entSep1, entConnWrap, entSep2, entInfoBtn, checklistBtn].forEach(function(el) {
      if (el) el.style.display = show ? '' : 'none';
    });
    [entSaveBtn, entLoadBtn].forEach(function(el) {
      if (el) el.style.display = show ? '' : 'none';
    });
    var legendEl = document.getElementById('legend');
    if (legendEl) legendEl.style.display = isEntranceShuffle ? 'none' : '';
  }

  updateEntControlsVisibility();

  // ── "Notes & Connectors" summary popup ──
  function isCleared(name) {
    try {
      var clearedState = JSON.parse(localStorage.getItem('ent-cleared') || '{}');
      return !!clearedState[name];
    } catch(ex) { return false; }
  }

  function renderInfoLists() {
    var notesList = document.getElementById('ent-info-notes-list');
    var connsList = document.getElementById('ent-info-conns-list');
    var includeNotesCleared = document.getElementById('ent-info-notes-cleared').checked;
    var includeConnsCleared = document.getElementById('ent-info-conns-cleared').checked;

    notesList.innerHTML = '';
    var noteNames = Object.keys(entNotes).filter(function(name) {
      return includeNotesCleared || !isCleared(name);
    });
    if (!noteNames.length) {
      notesList.innerHTML = '<div class="ent-info-empty">No notes yet.</div>';
    } else {
      noteNames.forEach(function(name) {
        var row = document.createElement('div');
        if (isCleared(name)) row.className = 'ent-info-cleared';
        row.textContent = name + ': ' + entNotes[name];
        notesList.appendChild(row);
      });
    }

    connsList.innerHTML = '';
    var conns = entConnections.filter(function(pair) {
      return includeConnsCleared || (!isCleared(pair[0]) && !isCleared(pair[1]));
    });
    if (!conns.length) {
      connsList.innerHTML = '<div class="ent-info-empty">No connectors yet.</div>';
    } else {
      conns.forEach(function(pair) {
        var row = document.createElement('div');
        if (isCleared(pair[0]) || isCleared(pair[1])) row.className = 'ent-info-cleared';
        row.textContent = pair[0] + ' <--> ' + pair[1];
        connsList.appendChild(row);
      });
    }

    var labelsList = document.getElementById('ent-info-labels-list');
    var includeLabelsCleared = document.getElementById('ent-info-labels-cleared').checked;
    labelsList.innerHTML = '';
    var labelNames = Object.keys(entLabels).filter(function(name) {
      return includeLabelsCleared || !isCleared(name);
    });
    if (!labelNames.length) {
      labelsList.innerHTML = '<div class="ent-info-empty">No labels yet.</div>';
    } else {
      labelNames.forEach(function(name) {
        var row = document.createElement('div');
        if (isCleared(name)) row.className = 'ent-info-cleared';
        row.textContent = name + ': ' + entLabels[name];
        labelsList.appendChild(row);
      });
    }
  }

  var infoPopup = document.getElementById('ent-info-popup');
  var infoBtn   = document.getElementById('ent-info-btn');
  var infoClose = document.getElementById('ent-info-close');
  if (infoBtn) {
    infoBtn.addEventListener('click', function() {
      renderInfoLists();
      infoPopup.classList.add('open');
    });
  }
  if (infoClose) {
    infoClose.addEventListener('click', function() { infoPopup.classList.remove('open'); });
  }
  ['ent-info-notes-cleared', 'ent-info-conns-cleared', 'ent-info-labels-cleared'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('change', renderInfoLists);
  });

  // ── Show/hide Labels column ──
  var showLabelsCheckbox = document.getElementById('ent-info-show-labels');
  var labelsCol = document.getElementById('ent-info-labels-col');
  function applyShowLabels() {
    var show = showLabelsCheckbox.checked;
    if (labelsCol) labelsCol.style.display = show ? '' : 'none';
  }
  if (showLabelsCheckbox) {
    try {
      var savedShowLabels = localStorage.getItem('ent-show-labels-col');
      if (savedShowLabels !== null) showLabelsCheckbox.checked = (savedShowLabels === 'true');
    } catch(ex) {}
    applyShowLabels();
    showLabelsCheckbox.addEventListener('change', function() {
      applyShowLabels();
      try { localStorage.setItem('ent-show-labels-col', showLabelsCheckbox.checked); } catch(ex) {}
    });
  }
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && infoPopup.classList.contains('open')) {
      infoPopup.classList.remove('open');
    }
  });

  // ── Full reset (called from New Game) ──
  window._entResetAll = function() {
    // Clear labels
    Object.keys(entLabels).forEach(function(name) { delete entLabels[name]; });
    saveLabels();
    Object.keys(entLabelEls).forEach(function(name) {
      entLabelEls[name].remove();
      delete entLabelEls[name];
    });
    refreshKeyLocationMarks();
    refreshSyntheticConnections();
    // Clear notes
    Object.keys(entNotes).forEach(function(name) { delete entNotes[name]; });
    saveNotes();
    // Clear connections
    entConnections = [];
    window._entConnections = entConnections;
    saveConnections();
    redrawAllConnections();
    refreshConnectionDependentDots();
    // Clear cleared/connect-pending marker state
    window._entConnectPending = null;
    try { localStorage.removeItem('ent-cleared'); } catch(ex) {}
    Object.keys(entMarkers).forEach(function(name) {
      entMarkers[name].classList.remove('cleared', 'connect-pending', 'ent-marked', 'ent-has-prize');
      entMarkers[name].style.background = '';
      var pIcon = entMarkers[name].querySelector('.ent-marker-prize');
      if (pIcon) pIcon.remove();
    });
    // Close popups if open
    closePopup();
    if (infoPopup) infoPopup.classList.remove('open');
  };
})();

// Refresh popup prize icons from current DUNGEONS state (item tracker is the source).
// Defined globally so the BroadcastChannel prizes handler can call it directly,
// regardless of whether the entrance overlay IIFE has run.
window.refreshPopupPrizeIcons = function() {
  document.querySelectorAll('.ent-popup-prize[data-dkey]').forEach(function(img) {
    var dk = img.dataset.dkey;
    var pDef = DUNGEONS[dk];
    if (!pDef || pDef.prize < 0) return;
    var isGreyed = !!(pDef.cleared || pDef.fullyCleared);
    img.src = isGreyed ? PRIZE_CYCLE[pDef.prize].imgCleared : PRIZE_CYCLE[pDef.prize].img;
  });
};

function cyclePrize(key) {
  var def = DUNGEONS[key];
  def.prize = (def.prize + 1) % PRIZE_CYCLE.length;
  def.img        = PRIZE_CYCLE[def.prize].img;
  def.imgCleared = PRIZE_CYCLE[def.prize].imgCleared;
  refreshDungeonImg(key);
  if (window._entRefreshPrizeIcons) window._entRefreshPrizeIcons();
}

// Prize image: bright (1.png = img) until obtained, then dim (0.png = imgCleared)
function refreshDungeonImg(key) {
  var def = DUNGEONS[key];
  var img = dngEls[key].querySelector('img');
  if (!img) return;
  var inv = window.trackerSettings && window.trackerSettings.inverted;

  if (inv && key === 'gt') {
    // Aga1 element (DW): show agahnim0 normally, agahnim1 when cleared, hide if fullyCleared
    if (def.fullyCleared) { img.style.display = 'none'; return; }
    img.style.display = '';
    img.src = def.cleared ? 'map/agahnim1.png' : 'map/agahnim0.png';
    return;
  }
  if (inv && key === 'ct') {
    // Ganon element (LW): always boss10, hide when fullyCleared
    if (def.fullyCleared) { img.style.display = 'none'; return; }
    img.style.display = '';
    img.src = 'map/boss10.png';
    return;
  }

  // Standard: CT (Agahnim) hide image when cleared
  if (key === 'ct' && def.fullyCleared) {
    img.style.display = 'none';
    return;
  }
  img.style.display = '';
  // Key Sanity: if prize is unknown but dungeon map is obtained, show map1.png as hint
  // Skip for CT/GT in inverted — they have fixed boss images, not prize cycles
  var settings = window.trackerSettings || {};
  var diModeMap = settings.dungeonItems || 'standard';
  var skipMapHint = inv && (key === 'ct' || key === 'gt');
  if (!skipMapHint && ['keysanity','mapcompass','mapcompasskeys','other'].includes(diModeMap)) {
    var cycle = PRIZE_CYCLE[def.prize];
    if (cycle && cycle.name === 'unknown' && def.mapObtained) {
      img.src = 'items/map1.png';
      return;
    }
  }
  img.src = def.cleared ? def.imgCleared : def.img;
  if (window._entRefreshPrizeIcons) window._entRefreshPrizeIcons();
}

// ── Logic refresh ─────────────────────────────────────────────────────────────
var COLOR_CLASS = { green:'available', yellow:'possible', orange:'visible', purple:'ool', red:'unavail' };

window.refreshMapLogic = function() {
  Object.keys(DUNGEONS).forEach(function(key) {
    var def = DUNGEONS[key];
    var el  = dngEls[key];
    var diMode = (window.trackerSettings && window.trackerSettings.dungeonItems) || 'standard';
    if (diMode === 'other') {
      // Other mode: boss beaten + chest clicked → cleared; boss beaten only → boss-cleared (light blue)
      if (def.cleared && def.otherCleared) {
        el.className = 'dng cleared';
      } else if (def.cleared) {
        el.className = 'dng boss-cleared';
      } else {
        var c = COLOR_CLASS[window.dungeonColor(key)] || 'unavail';
        el.className = 'dng ' + c;
      }
    } else if (def.fullyCleared) {
      // All items + boss done — go dark
      el.className = 'dng cleared';
    } else if (def.cleared) {
      // Boss beaten but items remain — light green box
      el.className = 'dng boss-cleared';
    } else {
      var c = COLOR_CLASS[window.dungeonColor(key)] || 'unavail';
      el.className = 'dng ' + c;
    }
    // ── Boss status stripe overlay ──
    // CT and GT don't have boss circles in the item tracker, so skip them.
    // Also skip entirely when Boss Shuffle is off (vanilla bosses — no
    // ambiguity worth marking).
    // While the boss isn't yet defeated, paint a diagonal stripe:
    //   - red    : a boss is selected but its required item is missing
    //   - red    : boss unknown ('?') AND the dungeon isn't reachable
    //   - yellow : boss unknown AND the dungeon is available/possible
    //   - none   : boss-ok (requirement met) or boss defeated
    var _bossDefeated = el.classList.contains('cleared') || el.classList.contains('boss-cleared');
    if (!['ct','gt'].includes(key) && !_bossDefeated) {
      // Boss state lives on DUNGEONS (persistent) — survives trackerItems
      // replacement on every items/prizes snap, so the stripe doesn't briefly
      // flicker when a snap arrives right after the user picks a boss.
      var _ti = window.trackerItems || {};
      var _bossState = DUNGEONS[key].bossState || 0;
      var _bossOk    = DUNGEONS[key].bossOk !== false;   // default true (undefined → true)
      var _avail     = COLOR_CLASS[window.dungeonColor(key)] || 'unavail';
      var _stripe    = '';
      if (_bossState > 0) {
        if (!_bossOk) _stripe = 'boss-stripe-red';
      } else if (_avail === 'available' || _avail === 'possible') {
        // Unknown boss in a reachable dungeon — usually yellow. But once the
        // player has firerod + icerod + hookshot + hammer, every possible
        // boss is beatable regardless of identity, so the warning is moot.
        var _allBossItems = (_ti.firerod > 0) && (_ti.icerod > 0)
                         && (_ti.hookshot > 0) && (_ti.hammer > 0);
        if (!_allBossItems) _stripe = 'boss-stripe-yellow';
      } else {
        _stripe = 'boss-stripe-red';
      }
      if (_stripe) el.classList.add(_stripe);
    }
    // Prize image: bright (1.png) until obtained, then dim (0.png)
    refreshDungeonImg(key);
  });
  // Refresh dot cleared state
  Object.keys(dotById).forEach(function(id) {
    dotById[id].className = dotClass(parseInt(id));
  });
  // Always hide CT-Room03 (109) and CT-Dark Maze (110) unless KS/MCK mode.
  // Also hide in entrance shuffle (KS/MCK or not) — these checks aren't
  // logically knowable without finding CT's entrance first.
  var _diMode = window.trackerSettings.dungeonItems;
  var _isEntShuffleCT = !!(window.trackerSettings && window.trackerSettings.entranceShuffle);
  if (!['keysanity','mapcompasskeys'].includes(_diMode) || _isEntShuffleCT) {
    if (dotById[109]) dotById[109].className = 'dot hidden';
    if (dotById[110]) dotById[110].className = 'dot hidden';
  } else if (window.trackerSettings && window.trackerSettings.inverted) {
    // In inverted KS/MCK: force correct colors for 109/110 based on DW DM access
    var _it     = window.trackerItems || {};
    var _glove  = _it.gloves >= 1;
    var _titan  = _it.gloves >= 2;
    var _flute  = _it.flute >= 1;
    var _pearl  = _it.moonpearl >= 1;
    var _aga    = _it.agahnim >= 1;
    var _ham    = _it.hammer >= 1;
    var _lamp   = _it.lamp >= 1 || _it.lamp === true;
    var _lwAcc  = _pearl && (_aga || _titan || (_glove && _ham));
    var _dwDM   = _glove || (_flute && _lwAcc);
    var _DMlight = _lamp || _flute;
    var _ctKeys = (_it.ctSmallKeys) || 0;
    if (dotById[109] && !checkState[109]) {
      dotById[109].className = _dwDM ? (_DMlight ? 'dot available' : 'dot possible') : 'dot unavail';
    }
    if (dotById[110] && !checkState[110]) {
      dotById[110].className = (_dwDM && _lamp && _ctKeys >= 1) ? 'dot available' : 'dot unavail';
    }
  }
  // Inverted mode: force DW village checks green regardless of checkLogic
  if (window.trackerSettings && window.trackerSettings.inverted) {
    var it = window.trackerItems || {};

    if (state.labels)      localStorage.setItem('ent-labels',      state.labels);
    if (state.connections) localStorage.setItem('ent-connections', state.connections);
    if (state.cleared)     localStorage.setItem('ent-cleared',     state.cleared);
    if (state.notes)       localStorage.setItem('ent-notes',       state.notes);
    if (state.checks)      localStorage.setItem('alttp-checks',    state.checks);
    // Reload the page to apply all restored state cleanly
    location.reload();
  } catch(e) {
    alert('Failed to load state file: ' + e.message);
  }
}

// ── Checklist storage bridge ──────────────────────────────────────────────────
// BroadcastChannel doesn't cross Electron window boundaries reliably, so the
// checklist also writes to localStorage. Map.html listens here for check toggles.
window.addEventListener('storage', function(ev) {
  if (ev.key !== 'alttp-check-toggle') return;
  try {
    var d = JSON.parse(ev.newValue);
    if (!d || d.id === undefined) return;
    var id = d.id;
    checkState[id] = !!d.cleared;
    saveCheckState();
    if (dotById[id]) dotById[id].className = dotClass(id);
    if (d.cleared && typeof window.markEntranceClearedByCode === 'function') {
      var _stAutoMap = { 68:'Kid', 101:'Smith', 4:'Mimic', 100:'Bat', 66:'Sahas', 13:'Spike', 84:'Library', 76:'Magic' };
      var _stCode = _stAutoMap[id];
      if (_stCode) window.markEntranceClearedByCode(_stCode);
    }
    window.refreshMapLogic();
  } catch(ex) {}
});

// ── Tooltip ───────────────────────────────────────────────────────────────────
function showTip(text, e) { var t = document.getElementById('tip'); t.textContent = text; t.style.display = 'block'; moveTip(e); }
function hideTip()        { document.getElementById('tip').style.display = 'none'; }
function moveTip(e) {
  var t = document.getElementById('tip');
  var x = e.clientX + 14, y = e.clientY - 30;
  if (x + 200 > window.innerWidth)  x = e.clientX - 210;
  if (y < 4) y = e.clientY + 14;
  t.style.left = x + 'px';
  t.style.top  = y + 'px';
}

// ── Zoom + Layout ─────────────────────────────────────────────────────────────
// Declare zoom state first so resizeWindowToMap can reference it
var ZOOM_STEPS = [70, 75, 80, 85, 90, 95, 100, 105, 110, 115, 120, 125, 130, 135, 140, 145, 150];
var zoomIdx = 1;

// Non-map chrome: topbar (~28px) + bottombar (~24px) + OS window chrome (~40px)
var CHROME_H = 92;

function resizeWindowToMap() {
  var pct    = ZOOM_STEPS[zoomIdx];
  var size   = Math.round(512 * pct / 100);
  var maps   = document.getElementById('maps');
  var isVert = maps ? maps.classList.contains('vertical') : false;
  var chromeW = window.outerWidth  - window.innerWidth;
  var chromeH = window.outerHeight - window.innerHeight;
  // Fall back to fixed estimate if browser reports 0 (e.g. before first paint)
  if (chromeW <= 0) chromeW = 16;
  if (chromeH <= 0) chromeH = CHROME_H;
  // topbar ~30px + bottombar ~24px + maps-outer padding ~28px + buffer = ~100px content chrome
  var contentChrome = 100;
  var w = (isVert ? size + 28 : size * 2 + 40) + chromeW;
  var h = (isVert ? size * 2 + 12 + contentChrome : size + contentChrome) + chromeH;
  try { window.resizeTo(w, h); } catch(e) {}
}

function setLayout(val) {
  var maps = document.getElementById('maps');
  if (val === 'vertical') maps.classList.add('vertical');
  else maps.classList.remove('vertical');
  try { localStorage.setItem('alttp-map-layout', val); } catch(ex) {}
  resizeWindowToMap();
}

function applyZoom() {
  var pct  = ZOOM_STEPS[zoomIdx];
  var size = Math.round(512 * pct / 100);
  document.querySelectorAll('.map-wrap').forEach(function(el) {
    el.style.width  = size + 'px';
    el.style.height = size + 'px';
  });
  document.getElementById('zoom-label').textContent = pct + '%';
  try { localStorage.setItem('alttp-map-zoom', String(pct)); } catch(ex) {}
  resizeWindowToMap();
}
function changeZoom(dir) {
  zoomIdx = Math.max(0, Math.min(ZOOM_STEPS.length - 1, zoomIdx + dir));
  applyZoom();
}

// ── Init layout + zoom from URL params / localStorage ────────────────────────
(function() {
  var p = new URLSearchParams(window.location.search);

  // In Electron, fix image paths to point to the unpacked asset folder
  var _assetBase = p.get('assetbase');
  if (_assetBase) {
    var _mapBase = _assetBase.replace(/\\/g, '/') + '/map';
    // Fix CSS background images for LW/DW maps
    var lwEl = document.getElementById('lw');
    var dwEl = document.getElementById('dw');
    if (lwEl) lwEl.style.backgroundImage = "url('" + _mapBase + "/map_lw.png')";
    if (dwEl) dwEl.style.backgroundImage = "url('" + _mapBase + "/map_dw.png')";
    // Fix dungeon prize/boss image paths
    Object.keys(DUNGEONS).forEach(function(key) {
      var d = DUNGEONS[key];
      if (d.img)        d.img        = d.img.replace('map/',        _mapBase + '/');
      if (d.imgCleared) d.imgCleared = d.imgCleared.replace('map/', _mapBase + '/');
    });
  }

  // Enemizer and GT crystal settings from launcher
  window.trackerSettings = window.trackerSettings || {};
  window.trackerSettings.enemizer   = p.get('enemizer')   || localStorage.getItem('alttp-enemizer')   || 'yes';
  window.trackerSettings.gtCrystals = parseInt(p.get('gtcrystals') || localStorage.getItem('alttp-gt-crystals') || '7');
  window.trackerSettings.gamemode      = p.get('gamemode')      || localStorage.getItem('alttp-gamemode')      || 'standard';
  window.trackerSettings.dungeonItems  = p.get('dungeonitems')  || localStorage.getItem('alttp-dungeon-items')  || 'standard';
  window.trackerSettings.swordless     = p.get('swordless')     || localStorage.getItem('alttp-swordless')     || 'no';
  window.trackerSettings.inverted      = window.trackerSettings.gamemode === 'inverted';

  // Refresh map logic now that settings are known
  window.refreshMapLogic();

  // Restore zoom index
  var pct  = parseInt(p.get('scale') || p.get('zoom') || '0') ||
             parseInt(localStorage.getItem('alttp-map-zoom') || '0') || 100;
  var best = 1, bestD = 9999;
  ZOOM_STEPS.forEach(function(z, i) { var d = Math.abs(z - pct); if (d < bestD) { bestD = d; best = i; } });
  zoomIdx = best;

  // Apply zoom (sets map-wrap sizes + resizes window)
  applyZoom();

  // Apply layout (also resizes window, which is fine — same size if horizontal default)
  var val = p.get('layout') || localStorage.getItem('alttp-map-layout') || 'horizontal';
  var sel = document.getElementById('layout-sel');
  if (sel) sel.value = val;
  setLayout(val);
})();

// ── Initialise prize counts in trackerItems from DUNGEONS defaults ────────────
(function() {
  var pc=0, gpc=0, rc=0, cc=0;
  Object.keys(DUNGEONS).forEach(function(k) {
    var def = DUNGEONS[k];
    if (!def.prizeObtained) return;
    var pname = PRIZE_CYCLE[def.prize] ? PRIZE_CYCLE[def.prize].name : '';
    if      (pname==='crystal')      { cc++; }
    else if (pname==='redcrystal')   { cc++; rc++; }
    else if (pname==='pendant')      { pc++; }
    else if (pname==='greenpendant') { pc++; gpc++; }
  });
  window.trackerItems.crystals     = cc;
  window.trackerItems.pendants     = pc;
  window.trackerItems.greenPendant = gpc;
  window.trackerItems.redCrystal   = rc;
})();

window.refreshMapLogic();

// ── Map's own WebSocket connection ────────────────────────────────────────────
// The map connects independently so it works even without the item tracker open.
var _mapWs = null;
var _mapReconnectTimer = null;
var _mapPollTimer = null;

// Visibility / focus-aware poll throttling. While the user is playing the
// game (map window blurred or hidden), we slow SNES polling to ease load
// on the QUsb2Snes / SNI / RetroArch bridge and reduce CPU competition with
// the emulator. The map's BroadcastChannel still receives item updates from
// the item tracker, so dot logic stays fresh even at the slow rate.
var MAP_POLL_FAST = 1000;     // ms when the map window is focused/visible
var MAP_POLL_SLOW = 4000;     // ms when the map window is in the background
var _mapPollRate  = MAP_POLL_FAST;

function _isMapActive() { return document.hasFocus() && !document.hidden; }

function _mapPollFn() {
  var bcFresh = (Date.now() - _lastBcRooms) < 3000;
  if (!bcFresh && _mapWs && _mapWs.readyState === WebSocket.OPEN) {
    _mapWs.send(JSON.stringify({ Opcode: 'GetAddress', Space: 'SNES', Operands: ['F5F000', '280'] }));
    _mapWs.send(JSON.stringify({ Opcode: 'GetAddress', Space: 'SNES', Operands: ['F5F280', '280'] }));
  }
}

function _refreshMapPollRate() {
  var newRate = _isMapActive() ? MAP_POLL_FAST : MAP_POLL_SLOW;
  if (newRate === _mapPollRate) return;
  _mapPollRate = newRate;
  // If polling is currently active, re-arm the interval at the new rate
  if (_mapPollTimer) {
    clearInterval(_mapPollTimer);
    _mapPollTimer = setInterval(_mapPollFn, _mapPollRate);
  }
}

window.addEventListener('focus',              _refreshMapPollRate);
window.addEventListener('blur',               _refreshMapPollRate);
document.addEventListener('visibilitychange', _refreshMapPollRate);
_mapPollRate = _isMapActive() ? MAP_POLL_FAST : MAP_POLL_SLOW;

function setConnStatus(text, cls) {
  var el = document.getElementById('conn-status');
  el.textContent = '● ' + text;
  el.className = cls || 'disconnected';
}

function mapConnect() {
  var host = localStorage.getItem('alttp-ws-host') || 'localhost';
  var port = localStorage.getItem('alttp-ws-port') || '23074';

  if (_mapWs) { _mapWs.onclose = null; _mapWs.onerror = null; _mapWs.close(); _mapWs = null; }
  clearTimeout(_mapReconnectTimer); clearInterval(_mapPollTimer); _mapPollTimer = null;

  setConnStatus('Connecting…', 'connecting');
  try { _mapWs = new WebSocket('ws://' + host + ':' + port); }
  catch(e) { setConnStatus('Error', 'error'); _scheduleReconnect(); return; }
  _mapWs.binaryType = 'arraybuffer';

  var _attached = false;

  _mapWs.onopen = function() {
    _mapWs.send(JSON.stringify({ Opcode: 'DeviceList', Space: 'SNES' }));
  };

  var _mapRoomChunk1 = null;
  var _mapRoomChunk1Time = 0;
  _mapWs.onmessage = function(evt) {
    if (evt.data instanceof ArrayBuffer) {
      var data = new Uint8Array(evt.data);
      if (data.length === 0x280) {
        var now = Date.now();
        if (_mapRoomChunk1 === null || (now - _mapRoomChunk1Time) > 1500) {
          _mapRoomChunk1 = data;
          _mapRoomChunk1Time = now;
        } else {
          var merged = new Uint8Array(0x500);
          merged.set(_mapRoomChunk1, 0);
          merged.set(data, 0x280);
          _mapRoomChunk1 = null;
          _mapRoomChunk1Time = 0;
          window.onRoomsUpdated(merged);
        }
      } else if (data.length === 0x420 || data.length === 0x500) {
        window.onRoomsUpdated(data);
      }
      return;
    }
    var r; try { r = JSON.parse(evt.data); } catch(e) { return; }
    if (!r.Results) return;
    if (!_attached) {
      if (!r.Results.length) { setConnStatus('No device', 'disconnected'); _scheduleReconnect(); return; }
      var dev = r.Results[0];
      _mapWs.send(JSON.stringify({ Opcode: 'Attach', Space: 'SNES', Operands: [dev] }));
      _mapWs.send(JSON.stringify({ Opcode: 'Name',   Space: 'SNES', Operands: ['ALTTP Map'] }));
      _attached = true;
      setConnStatus('Connected', 'connected');
      // Poll room data in two chunks — skip if BroadcastChannel is feeding fresh data.
      // Rate is dynamic via _mapPollRate (fast when focused, slow when backgrounded).
      _refreshMapPollRate();
      _mapPollTimer = setInterval(_mapPollFn, _mapPollRate);
    }
  };

  _mapWs.onerror = function() {
    // Don't show error if item tracker BC is feeding us data
    if ((Date.now() - _lastBcRooms) > 5000) {
      setConnStatus('Error — retrying…', 'error');
    }
  };
  _mapWs.onclose = function() {
    clearInterval(_mapPollTimer); _mapPollTimer = null;
    _attached = false;
    if ((Date.now() - _lastBcRooms) > 5000) {
      setConnStatus('Disconnected — retrying…', 'disconnected');
    }
    _scheduleReconnect();
  };
}

function _scheduleReconnect() {
  clearTimeout(_mapReconnectTimer);
  _mapReconnectTimer = setTimeout(mapConnect, 3000);
}

function openCheckList() {
  if (window.electronAPI && window.electronAPI.openCheckList) {
    window.electronAPI.openCheckList();
  } else {
    window.open('checklist.html', 'alttp-checklist', 'width=340,height=600,resizable=yes');
  }
}

function mapReconnect() {
  var btn = document.getElementById('reconnect-btn');
  btn.classList.add('spinning'); btn.disabled = true;
  clearTimeout(_mapReconnectTimer);
  mapConnect();
  setTimeout(function() { btn.classList.remove('spinning'); btn.disabled = false; }, 3000);
}

// Auto-connect on load
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', mapConnect);
  // Re-run resize after full page load so browser chrome dimensions are accurate
  window.addEventListener('load', function() {
    setTimeout(resizeWindowToMap, 150);
  });
} else {
  mapConnect();
}
</script>
